[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "posix-compat"
dynamic = ["version"]
authors = [
  { name="Wedonotuse", email="wedonotuse@outlook.com" },
]
description = "A cross-platform POSIX compatibility layer with CLI and GUI"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
keywords = ["posix", "cross-platform", "shell", "cli", "gui", "compatibility"]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "requests>=2.28.0",
]

[project.urls]
"Homepage" = "https://github.com/cycleuser/POSIX-Compatibility-Layer"
"Bug Tracker" = "https://github.com/cycleuser/POSIX-Compatibility-Layer/issues"

[project.scripts]
posix-cli = "posix_compat.cli:main"
posix-gui = "posix_compat.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "posix_compat.__version__"}